<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Coach de langue</title>
<script>document.documentElement.dataset.theme = localStorage.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
<header>
  <button id="menu" class="icon" aria-label="Conversations" aria-haspopup="dialog">☰</button>
  <h1 id="title">Coach de langue</h1>
  <span id="timer" class="pill" hidden></span>
  <button id="pause" class="icon" hidden aria-label="Mettre en pause">⏸</button>
  <button id="finish" class="icon" hidden aria-label="Terminer la séance">■</button>
  <button id="side" class="icon" hidden aria-label="Questions pendant la séance" aria-pressed="false">?</button>
  <button id="theme" class="icon" aria-label="Mode sombre" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div id="panes">
  <section id="main-pane">
    <main id="log" aria-label="Conversation"></main>
    <div id="rec" hidden role="status"></div>
    <div id="take" hidden></div>
    <form id="mainform">
      <textarea id="input" rows="1" autocomplete="off" placeholder="Message" aria-label="Message"></textarea>
      <button id="send" class="round" hidden aria-label="Envoyer">➤</button>
      <button id="mic" class="round" type="button" aria-label="Enregistrer un vocal">🎙</button>
    </form>
  </section>
  <section id="side-pane">
    <div id="slog" aria-label="Questions pendant la séance"></div>
    <div id="stake" hidden></div>
    <form id="sideform">
      <textarea id="sinput" rows="1" autocomplete="off" placeholder="Question" aria-label="Question"></textarea>
      <button id="ssend" class="round" hidden aria-label="Envoyer">➤</button>
      <button id="smic" class="round" type="button" aria-label="Enregistrer un vocal">🎙</button>
    </form>
  </section>
</div>
<div id="say" popover aria-label="Écouter">
  <button type="button" data-speed="normal">▶ Normal</button>
  <button type="button" data-speed="lent">🐢 Lent</button>
  <small id="say-msg" role="status"></small>
</div>
<dialog id="drawer" aria-label="Conversations">
  <nav>
    <button id="session" class="primary">Commencer une séance</button>
    <div id="caps" role="group" aria-label="Capacités audio pour la séance">
      <label><input type="checkbox" id="cap-ecoute"> Je peux écouter</label>
      <label><input type="checkbox" id="cap-parler"> Je peux parler</label>
    </div>
    <button id="new">Nouvelle conversation</button>
    <ul id="threads"></ul>
    <button id="lib">Enregistrements</button>
    <button id="dl">Téléchargements</button>
    <button id="prog">Progression</button>
    <button id="prefs">Paramètres</button>
    <button id="logout">Se déconnecter</button>
  </nav>
</dialog>
<dialog id="library" aria-label="Enregistrements">
  <nav>
    <h2>Enregistrements</h2>
    <form id="import">
      <input id="imp-file" type="file" accept="audio/*" required aria-label="Fichier audio">
      <div class="row">
        <select id="imp-task" aria-label="Sujet">
          <option value="journee">journée</option>
          <option value="presentation">présentation</option>
          <option value="film">film</option>
          <option value="lecture">lecture</option>
          <option value="conversation">conversation</option>
        </select>
        <select id="imp-mode" aria-label="Mode">
          <option value="spontane">spontané</option>
          <option value="lecture">lecture</option>
          <option value="entraine">entraîné</option>
        </select>
        <input id="imp-date" type="date" required aria-label="Date de la prise">
      </div>
      <input id="imp-note" type="text" placeholder="Note (facultatif)" aria-label="Note">
      <button class="primary" type="submit">Importer un fichier</button>
      <p id="imp-msg" role="status"></p>
    </form>
    <ul id="takes"></ul>
    <button id="lib-close">Fermer</button>
  </nav>
</dialog>
<dialog id="downloads" aria-label="Téléchargements">
  <nav>
    <h2>Téléchargements</h2>
    <p>Paquets Anki régénérés à chaque téléchargement. À ouvrir dans AnkiDroid.</p>
    <ul id="pkgs"></ul>
    <button id="dl-close">Fermer</button>
  </nav>
</dialog>
<dialog id="prefsdlg" aria-label="Paramètres">
  <nav>
    <h2>Paramètres</h2>
    <label for="set-provider">Fournisseur</label>
    <select id="set-provider">
      <option value="gemini">Gemini (Antigravity)</option>
      <option value="opencode">OpenCode Go</option>
    </select>
    <label for="set-model">Modèle</label>
    <select id="set-model"></select>
    <label for="set-mic">Micro</label>
    <select id="set-mic"><option value="">Automatique</option></select>
    <small>Auto : micro intégré sur téléphone, casque branché sur PC.</small>
    <p id="set-msg" role="status"></p>
    <button id="prefs-close">Fermer</button>
  </nav>
</dialog>
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
